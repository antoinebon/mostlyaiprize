defaults:
  - base_config
  - _self_

# Challenge identification
challenge_type: "flat"
generator_name: "flat_challenge_generator"

# Override MLflow experiment name for flat challenge
mlflow:
  experiment_name: "mostlyai_flat_challenge_v2"

# Data settings
data:
  path: "data/flat-training.csv"

# Approach: single table for flat data
approach: flat_table

tables:
  - name: flat_data
    tabular_model_configuration:
      # Core Configuration
      model: "MOSTLY_AI/Medium"
      max_epochs: 400
      max_training_time: 300  # 5 hours
      max_sample_size: null
      enable_flexible_generation: false
      
      # High Precision Configuration Settings
      # Mixed precision disabled for maximum numerical precision
      use_mixed_precision: false
      
      # Tighter gradient clipping for stability
      gradient_clip_norm: 1
      
      # Learning rate auto-determined by heuristic for optimal convergence
      learning_rate: 0.003
      
      # Warmup + Cosine scheduler with longer warmup for stability
      # scheduler_type: "warmup_cosine"
      scheduler_type: "plateau"
      # scheduler_type: "one_cycle"
      warmup_epochs: 10
      min_lr_ratio: 0.0001
      
      # Conservative regularization for better generalization
      # weight_decay: 0
      weight_decay: 0.001
      weight_decay_end: 0.001  # Automatically computed as weight_decay * 0.1 if not specified
      
      # More aggressive label smoothing for high precision
      label_smoothing: 0.0
      
      # EMA enabled with slower decay for more stable weights
      use_ema: false
      # ema_decay: 0.99995
      ema_decay: 0.99      

      # Enhanced early stopping with more patience for convergence
      early_stopping_patience: 10
      early_stopping_min_delta: 0.0001
      
      # Focal loss disabled (only enable for severe class imbalance)
      use_focal_loss: false
      focal_alpha: 1.0
      focal_gamma: 2.0
      
      # Data protection settings
      value_protection: null
      rare_category_replacement_method: null
      
      # Advanced batch configuration
      batch_size: 64
      gradient_accumulation_steps: null  # Auto-determined

      # dropout
      dnn_dropout: 0.2
      lstm_dropout: 0
