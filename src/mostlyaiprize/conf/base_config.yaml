# Base MOSTLY AI Prize Configuration
defaults:
  - approach: multi_table
  - training: standard
  - privacy: low
  - mlflow: local
  - _self_

# Generator settings
generator_name: "challenge2_generator"
random_seed: 42

# Data settings
data:
  path: "data/sequential-training.csv"
  subject_column: "group_id"  # Column that groups sequences

# Feature engineering settings for subject table creation
feature_engineering:
  enable_sequential: true     
  enable_distribution: true   
  enable_cross_column: true   
  enable_entropy: true        
  enable_correlations: true   

