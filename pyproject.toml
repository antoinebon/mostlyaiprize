[build-system]
requires = ["hatchling>=1.12.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "mostlyaiprize"
description = "MOSTLY AI Prize submission: Privacy-safe synthetic tabular data generation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Antoine Bon", email = "antoine.bon@gmail.com" },
]
dependencies = [
  # Core data manipulation
  "pandas",
  "numpy",
  "polars",
  
  # MOSTLY AI forks
  "mostlyai-engine @ git+https://github.com/antoinebon/mostlyai-engine.git",
  "mostlyai @ git+https://github.com/antoinebon/mostlyai.git",
  
  # Configuration management
  "hydra-core",
  "omegaconf",
  "flatten-dict",
  
  # Experiment tracking
  "mlflow",
]
dynamic = ["version"]

[project.scripts]
mostlyai = "mostlyaiprize.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mostlyaiprize"]

[tool.hatch.envs.dev]
dependencies = [
  "ruff==0.11.0",
  "mypy==1.15.0",
  "pytest",
  "pytest-mock",
]

[tool.hatch.envs.dev.scripts]
format = "ruff format {args:.}"
lint = "ruff check --unsafe-fixes --fix {args:.}"
typecheck = "mypy {args:.}"
test = "pytest {args}"

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "ANN", "RUF", "B", "C4", "PT", "SIM", "ARG", "ERA"]
ignore = ["D203", "D213", "ERA001", "D100", "D104", "ANN204", "ANN401", "ARG002", "N812", "N806", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["D", "ANN", "ARG001", "PT011"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# MyPy configuration  
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
ignore_missing_imports = true
