[build-system]
requires = ["hatchling>=1.12.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "mostlyaiprize"
description = "MOSTLY AI Prize submission: Privacy-safe synthetic tabular data generation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["synthetic-data", "privacy", "differential-privacy", "tabular-data", "machine-learning", "competition"]
authors = [
  { name = "Antoine Bon", email = "antoine.bon@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  # Core data manipulation
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "polars>=1.0",
  
  # MOSTLY AI SDK and related
  "mostlyai[local]>=4.0.0",
  
  "torch",
  
  # Machine learning and evaluation
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  
  # Data downloading and processing
  "requests>=2.31.0",
  
  # Utilities
  "tqdm>=4.65.0",
  "python-dotenv>=1.0.0",
  "pathlib",
  "typing-extensions>=4.7.0",
]
dynamic = ["version"]

[project.optional-dependencies]

# Additional evaluation and visualization tools
analysis = [
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "plotly>=5.15.0",
  "jupyter>=1.0.0",
  "ipython>=8.14.0",
]

# Advanced privacy and fairness tools
privacy = [
  "opacus>=1.4.0",
  "diffprivlib>=0.6.0",
  "fairlearn>=0.9.0",
]

# All optional dependencies
all = [
  "mostlyaiprize[analysis,privacy]",
]

[project.urls]
Documentation = "https://github.com/antoinebon/mostlyaiprize#readme"
Issues = "https://github.com/antoinebon/mostlyaiprize/issues"
Source = "https://github.com/antoinebon/mostlyaiprize"
Competition = "https://www.mostlyaiprize.com/"

[project.scripts]
mostlyai-train = "mostlyaiprize.cli:train_command"
mostlyai-generate = "mostlyaiprize.cli:generate_command"
mostlyai-evaluate = "mostlyaiprize.cli:evaluate_command"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mostlyaiprize"]
include = ["src/mostlyaiprize/py.typed"]

[tool.hatch.envs.default]
python = "3.12"

[tool.hatch.envs.dev]
dependencies = [
  # Linting and formatting
  "ruff==0.11.0",
  "mypy==1.15.0",
  "docformatter>=1.7.0",
  
  # Testing
  "pytest",
  "pytest-mock",
  
  # Development utilities
  "ipython>=8.14.0",
  "jupyter>=1.0.0",
  "notebook>=7.0.0",
  
  # Competition-specific tools
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
 
]


# Define convenient scripts for development and competition
[tool.hatch.envs.dev.scripts]
# Code quality
format = "ruff format {args:.}"
format-docs = "docformatter --in-place --recursive {args:.}"
format-all = ["format", "format-docs"]
lint = "ruff check --unsafe-fixes --fix {args:.}"
typecheck = "mypy {args:.}"

# Testing
test = "pytest {args}"
test-cov = "pytest --cov=src/mostlyaiprize {args}"
test-parallel = "pytest -n auto {args}"

# Competition-specific commands
download-data = "python scripts/download_competition_data.py"
train-challenge1 = "python scripts/train_challenge1.py"
train-challenge2 = "python scripts/train_challenge2.py"
generate-submission = "python scripts/generate_submission.py"
validate-submission = "python scripts/validate_submission.py"

# Jupyter notebooks
notebook = "jupyter notebook"
lab = "jupyter lab"

# All quality checks
all = [
    "format-all",
    "lint", 
    "typecheck",
    "test-cov",
]

# Quick competition workflow
quick-train = [
    "download-data",
    "train-challenge1",
    "generate-submission",
    "validate-submission",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "src/mostlyaiprize/__about__.py",
  "tests/*",
  "src/**/protocols.py",
  "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
  "raise AssertionError",
]
show_missing = true
precision = 2

# Ruff configuration (linting and formatting)
[tool.ruff]
line-length = 100  # Slightly shorter for competition readability
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "ANN", "RUF", "B", "C4", "PT", "SIM", "ARG", "ERA"]
ignore = ["D203", "D213", "ERA001", "D100", "D104", "ANN204", "ANN401", "ARG002", "N812", "N806", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["D", "ANN", "ARG001", "PT011"]
"scripts/*.py" = ["D", "ANN"]  # Relax for scripts
"notebooks/*.py" = ["D", "ANN", "E501"]  # Relax for notebooks

[tool.ruff.lint.isort]
known-first-party = ["mostlyaiprize"]
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6

# MyPy configuration
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
ignore_missing_imports = true

[tool.docformatter]
wrap-summaries = 100
wrap-description = 100

